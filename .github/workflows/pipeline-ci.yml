name: Esteira de Integracao Continua (CI)

# Define QUANDO o pipeline vai rodar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Define as tarefas (Jobs)
jobs:
  build-and-test:
    runs-on: ubuntu-latest # A máquina virtual (Runner) que o GitHub nos vai emprestar

    steps:
    - name: 1. Baixar o codigo fonte (Checkout)
      uses: actions/checkout@v3

    - name: 2. Configurar o ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Validacao Estatica (Lint com Flake8)
      run: |
        # O build vai quebrar rápido se houver erros de sintaxe graves
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Rodar Testes Automatizados (Pytest)
      run: |
        pytest -v

    - name: 6. Testar o Build do Docker
      # Se os testes passarem, garantimos que a imagem Docker compila sem erros
      run: |
        docker build -t fastorder-api-test .